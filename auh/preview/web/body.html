<div id="stage">
  <div id="panel">
    <div id="side">
      <i id="logo" class="ico" data-i="crown" data-s="30" style="background-color:#2f9bff"></i>
      <button id="dc" title="Discord"><i class="ico" data-i="discord" data-s="20" style="background-color:#2f9bff"></i></button>
    </div>
    <div id="page">
      <div id="head"></div>
      <div id="title">Burmalda.hook - Loader</div>
      <div id="desc">no cap, best fallen hvh script
- Burmalda</div>
      <div class="pill" id="ver">v1.0.0</div>
      <div class="pill" id="lang"><i class="ico" data-i="globe" data-s="12"></i><button data-l="en">EN</button><button data-l="ru">RU</button></div>
      <button id="close"><i class="ico" data-i="close" data-s="14"></i></button>

      <div id="s1" class="screen on">
        <div id="sel">
          <i class="ico crown" data-i="crown" data-s="34" style="background-color:#2f9bff"></i>
          <div id="hint"></div>
          <button id="selBtn"><span id="selText"></span><b>&#9662;</b></button>
          <div id="list"></div>
        </div>
      </div>

      <div id="s2" class="screen">
        <div id="col">
          <div class="card" id="timeCard"><div class="hd"><i class="ico" data-i="clock" data-s="14"></i><span id="tTime"></span></div><div class="big" id="clock">--</div><div class="small" id="date">--</div></div>
          <div class="card" id="userCard"><div class="hd"><i class="ico" data-i="user" data-s="14"></i><span id="tUser"></span></div><div class="big" id="user">Player</div></div>
          <div id="keyWrap"><i class="ico" data-i="key" data-s="14"></i><input id="key" autocomplete="off" spellcheck="false"></div>
          <button id="chk"></button>
          <div id="launch"><span id="launchText"></span><i class="ico" data-i="arrow" data-s="14"></i></div>
          <div class="card" id="status">
            <div id="stHead"></div><div id="stPill"></div>
            <i id="shield" class="ico" data-i="shield" data-s="18"></i>
            <div id="lic"></div><div id="sub"></div>
            <div id="timer">
              <div><div class="n" id="n0">0</div><div class="c" id="c0"></div><span class="dot"></span></div>
              <div><div class="n" id="n1">0</div><div class="c" id="c1"></div><span class="dot"></span></div>
              <div><div class="n" id="n2">0</div><div class="c" id="c2"></div></div>
            </div>
            <div id="div"></div>
            <div id="meta">
              <i class="ico" data-i="calendar" data-s="12" style="top:1px"></i><div class="cap" id="expCap" style="top:0"></div><div class="val" id="exp" style="top:15px">-</div>
              <i class="ico" data-i="cart" data-s="12" style="top:37px"></i><div class="cap" id="resCap" style="top:36px"></div><div class="val" style="top:51px">N/A</div>
            </div>
          </div>
          <button id="back"></button>
        </div>
        <div id="pic"><div id="glow"></div><img id="mascot" alt=""></div>
      </div>
    </div>
  </div>
</div>
<div id="toast"><span class="bar"></span><i class="ico" data-i="crown" data-s="18"></i><span id="toastText"></span></div>
<div id="done"><div id="doneText"></div><button id="again">RESTART DEMO</button></div>
